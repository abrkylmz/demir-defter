name: CI

on:
  push:
    branches: [main]
  pull_request:

# Aynı daldaki eski çalışmaları iptal et
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Biçim kontrolü
        run: npm run format:check

      - name: Tip kontrolü
        run: npm run typecheck --if-present

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
